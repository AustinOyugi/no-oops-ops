name: lango

source:
  context: "/Users/odu/Documents/alien/code-innate/enterprise/rolengi/security/lango-service"
  dockerfile: "/Users/odu/Documents/alien/code-innate/enterprise/rolengi/security/lango-service/Dockerfile"
  build:
    command:
      - mvn
      - package
      - -DskipTests

image:
  repository: lango-service
  replicas: 2

service:
  internal_port: 8080

healthcheck:
  test:
    - CMD
    - curl
    - -f
    - http://localhost:8080/lango/liveness
  start_period: 60s
  interval: 10s
  timeout: 10s
  retries: 3

env:
  file: lango.env.yml

  secrets:
    resolution: env

    resolvable:
      - REDIS_PASSWORD
      - AUTH_SERVER_API_CLIENT_SECRET
