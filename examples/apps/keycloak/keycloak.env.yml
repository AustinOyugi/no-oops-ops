sections:
  - name: database
    items:
      - key: KC_DB
        value: "postgres"

      - key: KC_DB_URL
        value: "jdbc:postgresql://dev-postgres:5432/keycloak"

      - key: KC_DB_USERNAME
        from_secret: KC_DB_USERNAME

      - key: KC_DB_PASSWORD
        from_secret: KC_DB_PASSWORD

  - name: hostname
    items:
      - key: KC_HOSTNAME
        value: "localhost"

      - key: KC_HTTP_ENABLED
        value: "true"

      - key: KC_HOSTNAME_STRICT
        value: "false"

      - key: KC_HOSTNAME_STRICT_HTTPS
        value: "false"

      - key: KC_HOSTNAME_STRICT_BACKCHANNEL
        value: "false"

  - name: monitoring
    items:
      - key: KC_HEALTH_ENABLED
        value: "true"

      - key: KC_METRICS_ENABLED
        value: "true"

  - name: admin
    items:
      - key: KEYCLOAK_ADMIN
        from_secret: KEYCLOAK_ADMIN

      - key: KEYCLOAK_ADMIN_PASSWORD
        from_secret: KEYCLOAK_ADMIN_PASSWORD

  - name: custom app
    items:
      - key: KITAMBULISHO_PIN_RESET_URL
        values:
          dev: "https://dev.nonprod.rolengiapps.com/accounts/kitambulisho/v1/api/security/pin-reset"
          prod: "https://api.rolengiapps.com/accounts/kitambulisho/v1/api/security/pin-reset"

      - key: ROLENGI_INSTITUTION
        value: "RGI"

      - key: ROLENGI_CHANNEL
        value: "web"

      - key: ROLENGI_ACCEPT_LANGUAGE
        value: "en"
