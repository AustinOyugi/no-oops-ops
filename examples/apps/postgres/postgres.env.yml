sections:
  - name: database
    items:
      - key: POSTGRES_USER_FILE
        value: "/run/secrets/POSTGRES_USER"

      - key: POSTGRES_PASSWORD_FILE
        value: "/run/secrets/POSTGRES_PASSWORD"

      - key: POSTGRES_USER
        from_secret: POSTGRES_USER_SECRET

      - key: POSTGRES_PASSWORD
        from_secret: POSTGRES_PASSWORD_SECRET