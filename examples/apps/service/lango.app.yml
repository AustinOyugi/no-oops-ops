name: lango

source:
  context: "/Users/odu/Documents/alien/code-innate/enterprise/rolengi/security/lango-service"
  dockerfile: "/Users/odu/Documents/alien/code-innate/enterprise/rolengi/security/lango-service/Dockerfile"
  build:
    command:
      - mvn
      - package
      - -DskipTests

image:
  repository: lango-service

service:
  internal_port: 8080
  replicas: 1

healthcheck:
  test:
    - CMD
    - curl
    - -f
    - http://localhost:8080/lango/liveness
  start_period: 60s
  interval: 10s
  timeout: 10s
  retries: 3

# Public HTTPS ingress. Replace this with a domain whose DNS A/AAAA record
# points at the Swarm manager before enabling it.
# expose:
#   enabled: true
#   domain: lango.example.com
#   tls: true
#   path_prefix: /

env:
  file: lango.env.yml

  secrets:
    resolution: env

    resolvable:
      - REDIS_PASSWORD
      - AUTH_SERVER_API_CLIENT_SECRET
