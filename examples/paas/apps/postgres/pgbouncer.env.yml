sections:
  - name: database
    items:
      - key: DB_HOST
        values:
          prod: prod-postgres_prod-postgres
          dev: dev-postgres_dev-postgres

      - key: DB_PORT
        value: "5432"

      - key: DB_NAME
        value: postgres

      - key: DB_USER
        from_secret: POSTGRES_USER_SECRET

      - key: DB_PASSWORD
        from_secret: POSTGRES_PASSWORD_SECRET

  - name: pool
    items:
      - key: AUTH_TYPE
        value: scram-sha-256

      - key: POOL_MODE
        value: transaction

      - key: MAX_CLIENT_CONN
        value: "500"

      - key: DEFAULT_POOL_SIZE
        value: "20"

      - key: RESERVE_POOL_SIZE
        value: "5"
