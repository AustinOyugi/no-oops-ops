sections:
  - name: database
    items:
      - key: DB_HOST
        values:
          local: local-postgres_local-postgres

      - key: DB_PORT
        value: "5432"

      # Leave DB_NAME unset so PgBouncer generates a wildcard database entry
      # (`* = host=…`). Clients can therefore connect to any database hosted
      # by this PostgreSQL service through the pooler.

      - key: DB_USER
        from_secret: POSTGRES_USER_SECRET

      - key: DB_PASSWORD
        from_secret: POSTGRES_PASSWORD_SECRET

  - name: pool
    items:
      - key: AUTH_TYPE
        value: scram-sha-256

      - key: POOL_MODE
        value: transaction

      - key: MAX_CLIENT_CONN
        value: "500"

      - key: DEFAULT_POOL_SIZE
        value: "20"

      - key: RESERVE_POOL_SIZE
        value: "5"
