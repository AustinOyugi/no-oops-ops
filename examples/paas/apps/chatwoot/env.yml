sections:
  - name: platform
    items:
      - key: FRONTEND_URL
        values:
          prod: https://chat.vybes.africa

      - key: POSTGRES_HOST
        values:
          prod: prod-pgbouncer_prod-pgbouncer

      - key: POSTGRES_PORT
        value: "5432"

      - key: POSTGRES_DATABASE
        value: chatwoot

      - key: POSTGRES_USERNAME
        from_secret: POSTGRES_USER_SECRET

      - key: POSTGRES_PASSWORD
        from_secret: POSTGRES_PASSWORD_SECRET

      - key: REDIS_URL
        values:
          prod: redis://prod-redis_prod-redis:6379

      - key: REDIS_PASSWORD
        from_secret: REDIS_PASSWORD_SECRET

      - key: RAILS_LOG_TO_STDOUT
        value: "true"

      - key: ACTIVE_STORAGE_SERVICE
        value: local

      - key: FORCE_SSL
        value: "true"

      - key: RAILS_MAX_THREADS
        value: "5"

      - key: LOG_LEVEL
        value: info

  - name: required_secrets
    items:
      - key: SECRET_KEY_BASE
        from_secret: SECRET_KEY_BASE
