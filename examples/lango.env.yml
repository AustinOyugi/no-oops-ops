sections:
  - name: app
    items:
      - key: SERVER_PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        values:
          prod: prod
          dev: dev

  - name: environment
    items:
      - key: ENVIRONMENT
        values:
          prod: prod
          dev: dev

      - key: REDIS_HOST
        values:
          dev: host.docker.internal

      - key: REDIS_PASSWORD
        from_secret: REDIS_PASSWORD_SECRET

  - name: auth server
    items:
      - key: AUTH_SERVER_API_CLIENT_SECRET
        from_secret: AUTH_SERVER_API_CLIENT_SECRET
